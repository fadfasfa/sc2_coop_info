[package]
name = "sco-tauri-overlay"
version = "0.1.0"
description = "SC2 info host using Tauri"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
s2protocol-port = { workspace = true }
s2coop-analyzer = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = { workspace = true }
pretty_env_logger = { workspace = true }

tauri = { version = "2.11.1", features = ["tray-icon"] }
display-info = { version = "0.5.9" }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"
tauri-plugin-global-shortcut = "2"
rayon = "1.10.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
notify = "8.2.0"
fastrand = "2.3.0"
sysinfo = "0.38.4"
rfd = "0.17.2"
tauri-plugin-opener = "2"
sys-locale = "0.3.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.26.2", default-features = false }
xcap = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"

[features]
default = []
