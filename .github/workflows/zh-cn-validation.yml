name: Chinese validation (no release)

on:
  push:
    branches: [codex/zh-cn-build]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      label: ${{ steps.target.outputs.label }}
      portable: ${{ steps.target.outputs.portable }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Packaging source allowlist regression
        run: node --test packaging/source-policy.test.mjs
      - id: target
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const t=require("./packaging/build-target.json"); if(!/^[a-f0-9]{40}$/.test(t.contribution)) throw Error("Expected exact commit"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`sha=${t.contribution}\nlabel=${t.label}\nportable=${t.portable}\n`);'
  validate:
    needs: target
    name: ${{ matrix.os }} / ${{ needs.target.outputs.label }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      CI: true
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri-overlay/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build and headless dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb-randr0-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libclang-dev xvfb
      - name: Record identity and assert no private fixtures
        shell: bash
        run: |
          mkdir -p validation-evidence
          { git rev-parse HEAD; node --version; npm --version; rustc --version; cargo --version; } > validation-evidence/identity.txt
          test ! -f .env
          test -z "$(find . -name '*.SC2Replay' -print -quit)"
      - name: Frontend install and asset build
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../validation-evidence/frontend-build.txt
      - name: Full Rust workspace tests (including bindings export)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --workspace --locked -- --nocapture 2>&1 | tee validation-evidence/rust-tests.txt
          else
            cargo test --workspace --locked -- --nocapture 2>&1 | tee validation-evidence/rust-tests.txt
          fi
      - name: Frontend type check after bindings export
        if: ${{ !cancelled() }}
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../validation-evidence/typecheck.txt
      - name: Frontend test type check
        if: ${{ !cancelled() }}
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:tests 2>&1 | tee ../validation-evidence/typecheck-tests.txt
      - name: Chinese resource and identity regression
        if: ${{ !cancelled() }}
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          npm run test:zh-cn 2>&1 | tee ../validation-evidence/chinese-resources.txt
      - name: Browser regression
        if: ${{ !cancelled() }}
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          npm run test:config -- --workers=2 --reporter=line 2>&1 | tee ../validation-evidence/playwright.txt
      - name: Get exact personal packaging sources
        if: ${{ success() && runner.os == 'Windows' && needs.target.outputs.portable == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .packaging-source
          persist-credentials: false
      - name: Apply fail-closed portable transformation
        if: ${{ success() && runner.os == 'Windows' && needs.target.outputs.portable == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code
          node --test .packaging-source/packaging/source-policy.test.mjs 2>&1 | tee validation-evidence/package-source-policy.txt
          node .packaging-source/packaging/apply-portable.mjs "$GITHUB_WORKSPACE" 2>&1 | tee validation-evidence/portable-apply.txt
          git diff --check
          PORTABLE_QA_SOURCE="$GITHUB_WORKSPACE" node --test .packaging-source/packaging/portable-contract.test.mjs 2>&1 | tee validation-evidence/portable-contract.txt
      - name: Portable isolation verification and EXE build (no bundler)
        if: ${{ success() && runner.os == 'Windows' && needs.target.outputs.portable == 'true' }}
        working-directory: tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p sco-tauri-overlay --lib portable_runtime:: -- --nocapture 2>&1 | tee ../validation-evidence/portable-rust-tests.txt
          npm run typecheck 2>&1 | tee ../validation-evidence/portable-typecheck.txt
          npm run typecheck:tests 2>&1 | tee ../validation-evidence/portable-typecheck-tests.txt
          npm run tauri -- build --no-bundle --no-sign -- --locked 2>&1 | tee ../validation-evidence/portable-build.txt
      - name: Package exact binary, data, licenses, source and hashes
        if: ${{ success() && runner.os == 'Windows' && needs.target.outputs.portable == 'true' }}
        shell: pwsh
        run: |
          node .packaging-source/packaging/make-portable.mjs $env:GITHUB_WORKSPACE "$env:GITHUB_WORKSPACE/.packaging-source" "$env:GITHUB_WORKSPACE/portable/SC2_Coop_Info_ZhCN_Portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath portable/SC2_Coop_Info_ZhCN_Portable -DestinationPath portable/SC2_Coop_Info_ZhCN_Portable.zip
          $packageHash = (Get-FileHash -LiteralPath portable/SC2_Coop_Info_ZhCN_Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash  SC2_Coop_Info_ZhCN_Portable.zip" | Set-Content -LiteralPath portable/SC2_Coop_Info_ZhCN_Portable.zip.sha256 -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: ${{ success() && runner.os == 'Windows' && needs.target.outputs.portable == 'true' }}
        with:
          name: SC2-Coop-Info-ZhCN-Portable-${{ needs.target.outputs.sha }}
          path: |
            portable/SC2_Coop_Info_ZhCN_Portable.zip
            portable/SC2_Coop_Info_ZhCN_Portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Record real-replay skips separately
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const p="validation-evidence/rust-tests.txt"; const s=(fs.existsSync(p)?fs.readFileSync(p,"utf8"):"Rust tests did not run").replace(/\u001b\[[0-9;]*m/g,""); let suite="unknown"; const rows=[]; for(const line of s.split(/\r?\n/)){const match=line.match(/Running\s+(.*?)\s+\(/); if(match) suite=match[1]; if(/skipping|did not run|\.\.\.\s+ignored\b|\b[1-9]\d* ignored;/i.test(line)) rows.push(suite+"\t"+line.trim());} fs.writeFileSync("validation-evidence/real-replay-skips.txt",rows.join("\n"));'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: validation-${{ matrix.os }}-${{ needs.target.outputs.label }}
          path: |
            validation-evidence/
            tauri-overlay/test-results/
            tauri-overlay/src/app/bindings/
            tauri-overlay/src/bindings/
            tauri-overlay/src-tauri/bindings/
            tauri-overlay/src-tauri/src/bindings/
          retention-days: 30
